site_name: "Literasi AI: Memahami dan Menggunakan Kecerdasan Buatan"
site_description: "Buku panduan literasi AI dan penggunaan praktis alat-alat AI untuk pemula hingga menengah"
site_author: Iis Afriyanti
site_url: https://iisafriyanti.github.io/ai-literacy/

theme:
  name: material
  language: id
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Ganti ke mode gelap
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Ganti ke mode terang
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    logo: material/brain

plugins:
  - git-authors
  - git-revision-date-localized

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - tables

nav:
  - Beranda: index.md
  - "Pengantar AI": pengantar-ai.md
  - "Etika dan Penggunaan AI yang Bertanggung Jawab": bab6-etika-ai.md
  - "Risiko dan Keterbatasan AI": bab7-risiko-keterbatasan.md
  - Dampak: dampak-ai.md
  - Panduan Penggunaan AI:
      - "Panduan Praktis untuk DDP 1": panduan-praktis/panduan-praktis-ddp1.md
      - "Panduan Praktis untuk PBP": panduan-praktis/panduan-praktis-pbp.md
      - "Panduan Tools AI": panduan-praktis/perangkat-ai-mahasiswa.md
