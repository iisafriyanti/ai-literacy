site_name: "Literasi AI: Memahami dan Menggunakan Kecerdasan Buatan"
site_description: "Buku panduan literasi AI dan penggunaan praktis alat-alat AI untuk pemula hingga menengah"
site_author: Iis Afriyanti
site_url: https://iisafriyanti.github.io/ai-literacy/

theme:
  name: material
  language: id
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Ganti ke mode gelap
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Ganti ke mode terang
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    logo: material/brain

plugins:
  - git-authors
  - git-revision-date-localized

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - tables

nav:
  - Beranda: index.md
  - "Pengetahuan tentang AI":
      - "Pengantar Literasi AI": bab1-pengantar-literasi-ai.md
      - "Artificial Intelligence": pengantar-ai.md
      - "Sejarah Singkat AI": bab3-sejarah-ai.md
      - "Jenis-Jenis AI": bab4-jenis-jenis-ai.md
      - "AI dalam Kehidupan Sehari-hari": bab5-ai-dalam-kehidupan.md
      - "Etika dan Penggunaan AI yang Bertanggung Jawab": bab6-etika-ai.md
      - "Risiko dan Keterbatasan AI": bab7-risiko-keterbatasan.md
      - "Dampak Penggunaan AI": dampak-ai.md
  - "Panduan Praktis Menggunakan AI":
      - "Mengenal Chatbot AI": panduan-praktis/mengenal-chatbot-ai.md
      - "Teknik Prompting Dasar": panduan-praktis/teknik-prompting.md
      - "AI untuk Produktivitas": panduan-praktis/ai-untuk-produktivitas.md
      - "AI untuk Kreativitas": panduan-praktis/ai-untuk-kreativitas.md
      - "Panduan Praktis untuk Mahasiswa DDP 1": panduan-praktis/panduan-praktis-ddp1.md
      - "Panduan Praktis untuk Mahasiswa PBP": panduan-praktis/panduan-praktis-pbp.md
      - "Panduan untuk Dosen Pemrograman": panduan-praktis/panduan-dosen-pemrograman.md
